stages:
  - build
  - test
  - deploy

variables:
  # Define the default Docker image for pipeline jobs
  DOCKER_IMAGE: flask-app:latest

# Step 1: Build the Docker container
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    # Login to Docker Hub (optional, if pushing to Docker registry)
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    # Build the Docker image
    - docker build -t $DOCKER_IMAGE .
    # (Optional) Push the image to Docker Hub
    - docker tag $DOCKER_IMAGE $DOCKER_USERNAME/$DOCKER_IMAGE
    - docker push $DOCKER_USERNAME/$DOCKER_IMAGE
  only:
    - exercise4  # Perform this step only on the listed branch

# Step 2: Run tests for the Flask application
test:
  stage: test
  image: python:3.9
  script:
    # Install requirements
    - pip install -r requirements.txt
    # Run the test suite (pytest)
    - pytest tests/ --disable-warnings
  only:
    - exercise4

# Step 3: Deploy the application using Docker Compose on the remote server
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
  script:
    # Securely copy the repository files to the remote server
    - ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER "mkdir -p ~/flask-app"
    - scp -o StrictHostKeyChecking=no -r * $DEPLOY_USER@$DEPLOY_SERVER:~/flask-app/

    # Execute Docker Compose on the remote server
    - ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER "
        cd ~/flask-app &&
        docker-compose down &&
        docker-compose build &&
        docker-compose up -d
      "
  only:
    - exercise4