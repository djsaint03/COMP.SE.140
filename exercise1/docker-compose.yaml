# docker-compose.yaml

services:
  nginx:
    build: ./nginx
    image: djsaint03/comp.se.140:nginx-${IMAGE_TAG:-latest}
    container_name: service_load-balancer
    ports:
      - "8198:80"  # Expose only NGINX on port 8081 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html/:/usr/share/nginx/html/
      - ./htpasswd:/etc/nginx/.htpasswd:ro

    depends_on:
      - service1


  service1:
    build: ./service1
    image: djsaint03/comp.se.140:service1-${IMAGE_TAG:-latest}
    deploy:
      replicas: 3
    environment:
      - SLEEP_DURATION=2
    ports:
      - "8199" # changing port mapping maybe use: -"8199"
    depends_on:
      - service2



  service2:
    build: ./service2
    image: djsaint03/comp.se.140:service2-${IMAGE_TAG:-latest}
