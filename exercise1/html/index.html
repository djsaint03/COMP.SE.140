<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service1 Load Balancer Interface</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        #responseArea {
            width: 100%;
            height: 150px;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-family: inherit;
        }

        .button-group {
            display: flex;
            gap: 1rem;
        }

        button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        #requestBtn {
            background-color: #4CAF50;
            color: white;
        }

        #stopBtn {
            background-color: #f44336;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .error {
            color: #f44336;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Service1 and Service2 Interface</h1>
        <textarea
            id="responseArea"
            placeholder="Response from Service1 will be displayed here"
            readonly
        ></textarea>
        <div class="button-group">
            <button id="requestBtn">REQUEST</button>
            <button id="stopBtn">STOP</button>
        </div>
    </div>

    <script>
        // Cache DOM elements
        const responseArea = document.getElementById('responseArea');
        const requestBtn = document.getElementById('requestBtn');
        const stopBtn = document.getElementById('stopBtn');

        // API endpoints
        const API = {
            REQUEST: '/api/service1',
            STOP: '/api/service1/stop'
        };

        // Helper functions
        const updateResponse = (message) => {
            responseArea.value = `${new Date().toISOString()}: ${message}`;
        };

        const setLoading = (isLoading) => {
            requestBtn.disabled = isLoading;
            stopBtn.disabled = isLoading;
            responseArea.style.opacity = isLoading ? 0.7 : 1;
        };

        const handleError = (error) => {
            console.error('Error:', error);
            updateResponse(`Error: ${error.message}`);
            setLoading(false);
        };

        // API calls
        async function makeRequest(endpoint, options = {}) {
            try {
                setLoading(true);
                const response = await fetch(endpoint, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    }
                });

                if (!response.ok) {
                    throw new Error(`Server responded with ${response.status}`);
                }

                const data = await response.text();
                updateResponse(data);
            } catch (error) {
                handleError(error);
            } finally {
                setLoading(false);
            }
        }

        // Event listeners
        requestBtn.addEventListener('click', () =>
            makeRequest(API.REQUEST)
        );

        stopBtn.addEventListener('click', () =>
            makeRequest(API.STOP, { method: 'POST' })
        );

        // Initial state
        updateResponse('Ready to make requests');
    </script>
</body>
</html>
