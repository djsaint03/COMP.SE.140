<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Service1 Load Balancer Interface</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #responseArea { width: 100%; height: 150px; margin-top: 20px; }
        button { margin: 10px; padding: 10px 20px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Service1 Interface</h1>
    <textarea id="responseArea" placeholder="Response from Service1 will be displayed here"></textarea>
    <button id="requestBtn">REQUEST</button>
    <button id="stop-btn">STOP</button>


    <script>
        document.getElementById('requestBtn').addEventListener('click', async () => {
            try {
                // Send request to Nginx, which will load balance to one of the service1 replicas
                const response = await fetch('http://localhost:54660');
                if (!response.ok) throw new Error('Network response was not ok');

                // Display the response text in the text area
                const data = await response.text();
                document.getElementById('responseArea').value = data;
            } catch (error) {
                document.getElementById('responseArea').value = `Error: ${error.message}`;
            }

            // Handle STOP button
        document.getElementById('stop-btn').onclick = function() {
            fetch('/stop');
            alert("Stopping all services...");
        };
        });
    </script>
</body>
</html>
